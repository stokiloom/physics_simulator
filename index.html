<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Физика. Тренажёр</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;max-width:900px;margin:0 auto;padding:20px;background:#f5f7fa;color:#2c3e50;line-height:1.5}
h1{color:#2c3e50;border-bottom:3px solid #3498db;padding-bottom:10px}
.screen{display:none}.screen.active{display:block}
.topics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin:15px 0}
.topic-item{background:#fff;padding:10px 15px;border-radius:6px;border:2px solid #e0e6ed;cursor:pointer;transition:all .2s}
.topic-item:hover{border-color:#3498db}
.topic-item.selected{background:#3498db;color:#fff;border-color:#2980b9}
.level-buttons,.type-buttons{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap}
.level-btn,.type-btn{flex:1;min-width:150px;padding:12px;background:#fff;border:2px solid #e0e6ed;border-radius:6px;cursor:pointer;font-size:15px;transition:all .2s}
.level-btn.selected,.type-btn.selected{background:#3498db;color:#fff;border-color:#2980b9}
.btn{padding:12px 24px;background:#3498db;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:16px;margin:10px 5px 10px 0}
.btn:hover{background:#2980b9}
.btn.secondary{background:#95a5a6}.btn.success{background:#27ae60}
.task{background:#fff;padding:20px;margin:15px 0;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.1)}
.task.correct{border-left:5px solid #27ae60}.task.incorrect{border-left:5px solid #e74c3c}
.task-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding-bottom:10px;border-bottom:1px solid #ecf0f1;flex-wrap:wrap;gap:8px}
.task-number{font-weight:700;color:#3498db;font-size:18px}
.task-topic{background:#ecf0f1;padding:4px 10px;border-radius:4px;font-size:13px;color:#7f8c8d}
.task-question{margin:15px 0;font-size:16px}
.task-given{background:#f8f9fa;padding:12px 15px;border-radius:6px;margin:10px 0;border-left:4px solid #3498db}
.task-given strong{color:#2980b9}
.answer-input{display:flex;gap:10px;align-items:center;margin-top:15px;flex-wrap:wrap}
.answer-input input{padding:10px;font-size:16px;border:2px solid #e0e6ed;border-radius:6px;width:180px}
.answer-unit{background:#ecf0f1;padding:10px 15px;border-radius:6px;font-weight:500}
.unit-options{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.unit-option{padding:8px 16px;background:#fff;border:2px solid #e0e6ed;border-radius:6px;cursor:pointer}
.unit-option.selected{background:#3498db;color:#fff;border-color:#2980b9}
.task-result{margin-top:15px;padding:12px;border-radius:6px;font-weight:500}
.task-result.correct{background:#d5f4e6;color:#27ae60}
.task-result.incorrect{background:#fadbd8;color:#c0392b}
.task-hint{margin-top:8px;font-size:13px;color:#888;font-style:italic}
.results-summary{background:#fff;padding:20px;border-radius:8px;margin:20px 0;box-shadow:0 2px 4px rgba(0,0,0,.1)}
.score{font-size:32px;font-weight:700;color:#3498db;text-align:center;margin:15px 0}
.score-bar{height:20px;background:#ecf0f1;border-radius:10px;overflow:hidden;margin:15px 0}
.score-fill{height:100%;background:linear-gradient(90deg,#27ae60,#2ecc71);transition:width .5s}
.stats{display:flex;justify-content:space-around;margin:20px 0}
.stat{text-align:center}.stat-value{font-size:24px;font-weight:700}.stat-label{color:#7f8c8d;font-size:14px}
.info-box{background:#eaf4fc;border-left:4px solid #3498db;padding:12px 15px;margin:15px 0;border-radius:4px}
.warning-box{background:#fef5e7;border-left:4px solid #f39c12;padding:12px 15px;margin:15px 0;border-radius:4px}
.topic-stat-card{background:#fff;padding:12px 15px;margin:8px 0;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.topic-stat-header{display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px}
.topic-stat-bar-bg{width:100%;height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden}
.topic-stat-bar-fill{height:100%;border-radius:4px}
.review-card{background:#fff;border-radius:8px;padding:15px;margin:12px 0;box-shadow:0 2px 5px rgba(0,0,0,.08);border-left:5px solid #ccc}
.review-card.correct{border-left-color:#4caf50}
.review-card.incorrect{border-left-color:#f44336}
.review-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:14px;color:#555}
.review-title{font-weight:600;color:#333}
.review-question{background:#f8f9fa;padding:10px;border-radius:6px;font-size:14px;margin-bottom:12px}
.review-formula{background:#fffbea;padding:14px;border-radius:6px;margin:12px 0;text-align:center;border:1px dashed #f39c12;font-size:17px;overflow-x:auto}
.review-formula-label{font-size:13px;color:#b7791f;font-weight:600;margin-bottom:6px;text-align:left}
.ans-row{display:flex;align-items:center;gap:10px;font-size:14px;margin:6px 0;flex-wrap:wrap}
.ans-label{min-width:140px;color:#666;font-weight:500}
.ans-value{font-weight:700;padding:4px 10px;border-radius:4px}
.ans-value.correct{background:#e8f5e9;color:#2e7d32}
.ans-value.incorrect{background:#ffebee;color:#c62828}
</style>
</head>
<body>
<h1>🔬 Физика. Тренажёр</h1>

<div id="settings-screen" class="screen active">
<h2>Настройки теста</h2>
<h3>Выберите темы:</h3>
<div class="info-box">💡 Нажмите на тему, чтобы выбрать её.</div>
<div style="margin-bottom:10px">
<button class="btn secondary" onclick="selectAllTopics()">Выбрать все темы</button>
<button class="btn secondary" onclick="deselectAllTopics()">Снять выбор</button>
</div>
<div id="topics-grid" class="topics-grid"></div>
<h3>Уровень сложности:</h3>
<div class="level-buttons">
<button class="level-btn" data-level="1" onclick="selectLevel(1)"><strong>Уровень 1</strong><br>Найти основную величину</button>
<button class="level-btn" data-level="2" onclick="selectLevel(2)"><strong>Уровень 2</strong><br>Выразить вспомогательную величину</button>
</div>
<h3>Тип заданий:</h3>
<div class="type-buttons">
<button class="type-btn" data-type="tasks" onclick="selectType('tasks')">Только задачи</button>
<button class="type-btn" data-type="units" onclick="selectType('units')">Только единицы</button>
<button class="type-btn selected" data-type="mixed" onclick="selectType('mixed')">Смешанный</button>
</div>
<div class="warning-box">⚠️ Ответы округляются до сотых.</div>
<button class="btn success" onclick="generateTest()" style="font-size:18px;padding:15px 30px">🚀 Сформировать тест</button>
</div>

<div id="test-screen" class="screen">
<h2>Тест</h2>
<div class="info-box">📝 Введите ответы, затем нажмите «Проверить».</div>
<div id="tasks-container"></div>
<button class="btn success" onclick="checkTest()" style="font-size:18px;padding:15px 30px">✓ Проверить ответы</button>
<button class="btn secondary" onclick="showScreen('settings-screen')">← Назад</button>
</div>

<div id="results-screen" class="screen">
<h2>Результаты</h2>
<div class="results-summary">
<div class="score" id="score-text"></div>
<div class="score-bar"><div class="score-fill" id="score-fill"></div></div>
<div class="stats">
<div class="stat"><div class="stat-value" id="correct-count">0</div><div class="stat-label">Правильных</div></div>
<div class="stat"><div class="stat-value" id="incorrect-count">0</div><div class="stat-label">Неправильных</div></div>
<div class="stat"><div class="stat-value" id="total-count">0</div><div class="stat-label">Всего</div></div>
</div>
</div>
<div id="detailed-results"></div>
<div style="margin-top:30px;display:flex;gap:15px;flex-wrap:wrap;justify-content:center">
<button class="btn success" onclick="restartTest()">🔄 Пройти ещё раз</button>
<button class="btn secondary" onclick="showScreen('settings-screen')">⚙️ Изменить настройки</button>
</div>
</div>

<script>
// ============================================================================
// МАССИВ ФОРМУЛ: поле formula = LaTeX, calcMain = Уровень 1, calcOther = Уровень 2
// ============================================================================
const formulas=[
// ТЕСТ 1
{id:"uniform_velocity",topic:"Тест 1. Равномерное прямолинейное движение",name:"Скорость равномерного движения",mainVar:"velocity",formula:"$$v = \\frac{\\Delta r}{\\Delta t}$$",calcMain:(v)=>v.displacement/v.time,calcOther:{displacement:(v)=>v.velocity*v.time,time:(v)=>v.displacement/v.velocity},variables:{velocity:{name:"скорость",unit:"м/с",min:5,max:50},displacement:{name:"перемещение",unit:"м",min:10,max:500},time:{name:"время",unit:"с",min:1,max:60}}},
{id:"uniform_kinematic",topic:"Тест 1. Равномерное прямолинейное движение",name:"Кинематический закон",mainVar:"position",formula:"$$x = x_0 + v_x t$$",calcMain:(v)=>v.initialPosition+v.velocity*v.time,calcOther:{initialPosition:(v)=>v.position-v.velocity*v.time,velocity:(v)=>(v.position-v.initialPosition)/v.time,time:(v)=>(v.position-v.initialPosition)/v.velocity},variables:{position:{name:"координата",unit:"м",min:0,max:1000},initialPosition:{name:"начальная координата",unit:"м",min:0,max:100},velocity:{name:"скорость",unit:"м/с",min:1,max:50},time:{name:"время",unit:"с",min:1,max:60}}},
{id:"galileo_velocity",topic:"Тест 1. Равномерное прямолинейное движение",name:"Сложение скоростей",mainVar:"velocity",formula:"$$\\vec{v} = \\vec{v}_0 + \\vec{v}_1$$",calcMain:(v)=>v.initialVelocity+v.transferVelocity,calcOther:{initialVelocity:(v)=>v.velocity-v.transferVelocity,transferVelocity:(v)=>v.velocity-v.initialVelocity},variables:{velocity:{name:"абсолютная скорость",unit:"м/с",min:10,max:100},initialVelocity:{name:"относительная скорость",unit:"м/с",min:1,max:50},transferVelocity:{name:"переносная скорость",unit:"м/с",min:1,max:50}}},
{id:"average_speed",topic:"Тест 1. Равномерное прямолинейное движение",name:"Средняя скорость пути",mainVar:"averageVelocity",formula:"$$v_{ср} = \\frac{s}{\\Delta t}$$",calcMain:(v)=>v.distance/v.time,calcOther:{distance:(v)=>v.averageVelocity*v.time,time:(v)=>v.distance/v.averageVelocity},variables:{averageVelocity:{name:"средняя скорость",unit:"м/с",min:1,max:100},distance:{name:"путь",unit:"м",min:10,max:1000},time:{name:"время",unit:"с",min:1,max:100}}},
// ТЕСТ 2
{id:"acceleration",topic:"Тест 2. Равноускоренное прямолинейное движение",name:"Ускорение",mainVar:"acceleration",formula:"$$\\vec{a} = \\frac{\\vec{v} - \\vec{v}_0}{\\Delta t}$$",calcMain:(v)=>(v.speed-v.initialSpeed)/v.time,calcOther:{speed:(v)=>v.initialSpeed+v.acceleration*v.time,initialSpeed:(v)=>v.speed-v.acceleration*v.time,time:(v)=>(v.speed-v.initialSpeed)/v.acceleration},variables:{acceleration:{name:"ускорение",unit:"м/с²",min:1,max:20},speed:{name:"конечная скорость",unit:"м/с",min:10,max:100},initialSpeed:{name:"начальная скорость",unit:"м/с",min:0,max:20},time:{name:"время",unit:"с",min:1,max:20}}},
{id:"instantaneous_velocity",topic:"Тест 2. Равноускоренное прямолинейное движение",name:"Мгновенная скорость",mainVar:"speed",formula:"$$\\vec{v} = \\vec{v}_0 + \\vec{a}t$$",calcMain:(v)=>v.initialSpeed+v.acceleration*v.time,calcOther:{initialSpeed:(v)=>v.speed-v.acceleration*v.time,acceleration:(v)=>(v.speed-v.initialSpeed)/v.time,time:(v)=>(v.speed-v.initialSpeed)/v.acceleration},variables:{speed:{name:"конечная скорость",unit:"м/с",min:10,max:100},initialSpeed:{name:"начальная скорость",unit:"м/с",min:0,max:20},acceleration:{name:"ускорение",unit:"м/с²",min:1,max:20},time:{name:"время",unit:"с",min:1,max:20}}},
{id:"displacement_time",topic:"Тест 2. Равноускоренное прямолинейное движение",name:"Перемещение через время",mainVar:"displacement",formula:"$$\\Delta \\vec{r} = \\vec{v}_0 t + \\frac{\\vec{a}t^2}{2}$$",calcMain:(v)=>v.initialSpeed*v.time+v.acceleration*v.time*v.time/2,calcOther:{initialSpeed:(v)=>(v.displacement-v.acceleration*v.time*v.time/2)/v.time,acceleration:(v)=>2*(v.displacement-v.initialSpeed*v.time)/(v.time*v.time)},variables:{displacement:{name:"перемещение",unit:"м",min:10,max:1000},initialSpeed:{name:"начальная скорость",unit:"м/с",min:0,max:20},acceleration:{name:"ускорение",unit:"м/с²",min:1,max:20},time:{name:"время",unit:"с",min:1,max:20}}},
{id:"displacement_no_time",topic:"Тест 2. Равноускоренное прямолинейное движение",name:"Перемещение без времени",mainVar:"displacement",formula:"$$\\Delta r_x = \\frac{v_x^2 - v_{0x}^2}{2a_x}$$",calcMain:(v)=>(v.speed*v.speed-v.initialSpeed*v.initialSpeed)/(2*v.acceleration),calcOther:{speed:(v)=>Math.sqrt(v.initialSpeed*v.initialSpeed+2*v.acceleration*v.displacement),acceleration:(v)=>(v.speed*v.speed-v.initialSpeed*v.initialSpeed)/(2*v.displacement)},variables:{displacement:{name:"перемещение",unit:"м",min:10,max:1000},speed:{name:"конечная скорость",unit:"м/с",min:10,max:100},initialSpeed:{name:"начальная скорость",unit:"м/с",min:0,max:20},acceleration:{name:"ускорение",unit:"м/с²",min:1,max:20}}},
{id:"displacement_avg_velocity",topic:"Тест 2. Равноускоренное прямолинейное движение",name:"Перемещение через среднюю скорость",mainVar:"displacement",formula:"$$\\Delta r_x = \\frac{v_{0x} + v_x}{2}t$$",calcMain:(v)=>(v.initialSpeed+v.speed)/2*v.time,calcOther:{initialSpeed:(v)=>2*v.displacement/v.time-v.speed,speed:(v)=>2*v.displacement/v.time-v.initialSpeed,time:(v)=>2*v.displacement/(v.initialSpeed+v.speed)},variables:{displacement:{name:"перемещение",unit:"м",min:10,max:1000},initialSpeed:{name:"начальная скорость",unit:"м/с",min:0,max:20},speed:{name:"конечная скорость",unit:"м/с",min:10,max:100},time:{name:"время",unit:"с",min:1,max:20}}},
{id:"kinematic_law_2",topic:"Тест 2. Равноускоренное прямолинейное движение",name:"Кинематический закон",mainVar:"position",formula:"$$x = x_0 + v_{0x}t + \\frac{a_x t^2}{2}$$",calcMain:(v)=>v.initialPosition+v.initialSpeed*v.time+v.acceleration*v.time*v.time/2,calcOther:{initialPosition:(v)=>v.position-v.initialSpeed*v.time-v.acceleration*v.time*v.time/2,initialSpeed:(v)=>(v.position-v.initialPosition-v.acceleration*v.time*v.time/2)/v.time},variables:{position:{name:"координата",unit:"м",min:0,max:1000},initialPosition:{name:"начальная координата",unit:"м",min:0,max:100},initialSpeed:{name:"начальная скорость",unit:"м/с",min:0,max:20},acceleration:{name:"ускорение",unit:"м/с²",min:1,max:20},time:{name:"время",unit:"с",min:1,max:20}}},
// ТЕСТ 3
{id:"free_fall_velocity",topic:"Тест 3. Свободное падение",name:"Скорость при свободном падении",mainVar:"speed",formula:"$$\\vec{v} = \\vec{v}_0 + \\vec{g}t$$",calcMain:(v)=>v.initialSpeed+10*v.time,calcOther:{initialSpeed:(v)=>v.speed-10*v.time,time:(v)=>(v.speed-v.initialSpeed)/10},variables:{speed:{name:"скорость",unit:"м/с",min:10,max:100},initialSpeed:{name:"начальная скорость",unit:"м/с",min:0,max:30},time:{name:"время",unit:"с",min:1,max:10}}},
{id:"free_fall_displacement",topic:"Тест 3. Свободное падение",name:"Перемещение при свободном падении",mainVar:"displacement",formula:"$$\\Delta \\vec{r} = \\vec{v}_0 t + \\frac{\\vec{g}t^2}{2}$$",calcMain:(v)=>v.initialSpeed*v.time+10*v.time*v.time/2,calcOther:{initialSpeed:(v)=>(v.displacement-10*v.time*v.time/2)/v.time},variables:{displacement:{name:"перемещение",unit:"м",min:10,max:500},initialSpeed:{name:"начальная скорость",unit:"м/с",min:0,max:30},time:{name:"время",unit:"с",min:1,max:10}}},
{id:"projectile_time",topic:"Тест 3. Свободное падение",name:"Время полёта",mainVar:"time",formula:"$$t_{п} = \\frac{2v_0 \\sin\\alpha}{g}$$",calcMain:(v)=>2*v.initialSpeed*Math.sin(v.angle*Math.PI/180)/10,calcOther:{initialSpeed:(v)=>v.time*10/(2*Math.sin(v.angle*Math.PI/180))},variables:{time:{name:"время полёта",unit:"с",min:1,max:20},initialSpeed:{name:"начальная скорость",unit:"м/с",min:20,max:100},angle:{name:"угол броска",unit:"°",min:30,max:60}}},
{id:"projectile_max_height",topic:"Тест 3. Свободное падение",name:"Максимальная высота",mainVar:"maxHeight",formula:"$$h_{max} = \\frac{v_0^2 \\sin^2\\alpha}{2g}$$",calcMain:(v)=>{const s=Math.sin(v.angle*Math.PI/180);return v.initialSpeed*v.initialSpeed*s*s/20},calcOther:{initialSpeed:(v)=>Math.sqrt(v.maxHeight*20)/Math.sin(v.angle*Math.PI/180)},variables:{maxHeight:{name:"максимальная высота",unit:"м",min:5,max:200},initialSpeed:{name:"начальная скорость",unit:"м/с",min:20,max:100},angle:{name:"угол броска",unit:"°",min:30,max:60}}},
{id:"projectile_range",topic:"Тест 3. Свободное падение",name:"Дальность полёта",mainVar:"range",formula:"$$L = \\frac{v_0^2 \\sin 2\\alpha}{g}$$",calcMain:(v)=>v.initialSpeed*v.initialSpeed*Math.sin(2*v.angle*Math.PI/180)/10,calcOther:{initialSpeed:(v)=>Math.sqrt(v.range*10/Math.sin(2*v.angle*Math.PI/180))},variables:{range:{name:"дальность полёта",unit:"м",min:10,max:1000},initialSpeed:{name:"начальная скорость",unit:"м/с",min:20,max:100},angle:{name:"угол броска",unit:"°",min:30,max:60}}},
// ТЕСТ 4
{id:"period",topic:"Тест 4. Движение по окружности",name:"Период",mainVar:"period",formula:"$$T = \\frac{t}{N} = \\frac{1}{\\nu}$$",calcMain:(v)=>v.time/v.revolutions,calcOther:{time:(v)=>v.period*v.revolutions,revolutions:(v)=>v.time/v.period},variables:{period:{name:"период",unit:"с",min:1,max:10},time:{name:"время",unit:"с",min:1,max:100},revolutions:{name:"число оборотов",unit:"",min:1,max:100}}},
{id:"frequency",topic:"Тест 4. Движение по окружности",name:"Частота",mainVar:"frequency",formula:"$$\\nu = \\frac{N}{t} = \\frac{1}{T}$$",calcMain:(v)=>v.revolutions/v.time,calcOther:{revolutions:(v)=>v.frequency*v.time,time:(v)=>v.revolutions/v.frequency},variables:{frequency:{name:"частота",unit:"Гц",min:1,max:10},revolutions:{name:"число оборотов",unit:"",min:1,max:100},time:{name:"время",unit:"с",min:1,max:100}}},
{id:"angular_velocity",topic:"Тест 4. Движение по окружности",name:"Угловая скорость",mainVar:"angularVelocity",formula:"$$\\omega = \\frac{2\\pi}{T} = 2\\pi\\nu$$",calcMain:(v)=>2*Math.PI/v.period,calcOther:{period:(v)=>2*Math.PI/v.angularVelocity},variables:{angularVelocity:{name:"угловая скорость",unit:"рад/с",min:1,max:20},period:{name:"период",unit:"с",min:1,max:10}}},
{id:"linear_velocity",topic:"Тест 4. Движение по окружности",name:"Линейная скорость",mainVar:"velocity",formula:"$$v = \\frac{2\\pi R}{T} = \\omega R$$",calcMain:(v)=>v.angularVelocity*v.radius,calcOther:{angularVelocity:(v)=>v.velocity/v.radius,radius:(v)=>v.velocity/v.angularVelocity},variables:{velocity:{name:"линейная скорость",unit:"м/с",min:1,max:100},radius:{name:"радиус",unit:"м",min:1,max:50},angularVelocity:{name:"угловая скорость",unit:"рад/с",min:1,max:20}}},
{id:"centripetal_acceleration",topic:"Тест 4. Движение по окружности",name:"Центростремительное ускорение",mainVar:"acceleration",formula:"$$a = \\frac{v^2}{R} = \\omega^2 R$$",calcMain:(v)=>v.velocity*v.velocity/v.radius,calcOther:{velocity:(v)=>Math.sqrt(v.acceleration*v.radius),radius:(v)=>v.velocity*v.velocity/v.acceleration},variables:{acceleration:{name:"центростремительное ускорение",unit:"м/с²",min:1,max:100},velocity:{name:"линейная скорость",unit:"м/с",min:1,max:100},radius:{name:"радиус",unit:"м",min:1,max:50}}},

// ============================================================================
// СОСТОЯНИЕ И ЛОГИКА
// ============================================================================
let state={selectedTopics:new Set(),level:null,type:'mixed',tasks:[]};

function initTopics(){
  const topics=[...new Set(formulas.map(f=>f.topic))];
  const grid=document.getElementById('topics-grid');
  grid.innerHTML='';
  topics.forEach(t=>{
    const item=document.createElement('div');
    item.className='topic-item';
    item.textContent=t;
    item.onclick=()=>toggleTopic(t,item);
    grid.appendChild(item);
  });
}
function toggleTopic(t,el){
  if(state.selectedTopics.has(t)){state.selectedTopics.delete(t);el.classList.remove('selected');}
  else{state.selectedTopics.add(t);el.classList.add('selected');}
}
function selectAllTopics(){
  [...new Set(formulas.map(f=>f.topic))].forEach(t=>state.selectedTopics.add(t));
  document.querySelectorAll('.topic-item').forEach(el=>el.classList.add('selected'));
}
function deselectAllTopics(){
  state.selectedTopics.clear();
  document.querySelectorAll('.topic-item').forEach(el=>el.classList.remove('selected'));
}
function selectLevel(l){
  state.level=l;
  document.querySelectorAll('.level-btn').forEach(b=>b.classList.toggle('selected',parseInt(b.dataset.level)===l));
}
function selectType(t){
  state.type=t;
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.toggle('selected',b.dataset.type===t));
}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function randomInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function randomChoice(arr){return arr[Math.floor(Math.random()*arr.length)];}

// ============================================================
// ГЕНЕРАЦИЯ ЗНАЧЕНИЙ
// ============================================================
function generateValues(formula,targetVar,maxAttempts=300){
  const vars=formula.variables;
  const otherVars=Object.keys(vars).filter(k=>k!==targetVar);
  for(let attempt=0;attempt<maxAttempts;attempt++){
    const values={};
    for(const key of otherVars){
      const def=vars[key];
      values[key]=randomInt(Math.ceil(def.min),Math.floor(def.max));
    }
    let raw;
    try{
      if(targetVar===formula.mainVar){
        if(typeof formula.calcMain!=='function')continue;
        raw=formula.calcMain(values);
      }else{
        const fn=formula.calcOther&&formula.calcOther[targetVar];
        if(typeof fn!=='function')continue;
        raw=fn(values);
      }
    }catch(e){continue;}
    if(typeof raw!=='number'||!Number.isFinite(raw))continue;
    if(raw<=0)continue;
    const answer=Math.round(raw*100)/100;
    if(answer<=0||answer>1e9)continue;
    values[targetVar]=answer;
    return {values,answer,exactAnswer:raw};
  }
  return null;
}

function generateTask(formula,level){
  let targetVar;
  if(level===1){
    targetVar=formula.mainVar;
  }else{
    const candidates=Object.keys(formula.variables)
      .filter(v=>v!==formula.mainVar)
      .filter(v=>formula.calcOther&&typeof formula.calcOther[v]==='function');
    targetVar=candidates.length?randomChoice(candidates):formula.mainVar;
  }
  const result=generateValues(formula,targetVar);
  if(!result)return null;
  return {formula,level,targetVar,values:result.values,answer:result.answer,exactAnswer:result.exactAnswer};
}

function generateUnitQuestion(q){
  const shuffled=[...q.options].sort(()=>Math.random()-0.5);
  return {type:'unit',question:q.question,options:shuffled,correct:q.correct,userAnswer:null,topic:q.topic};
}

function generateTest(){
  if(state.selectedTopics.size===0&&state.type!=='units'){alert('Выберите хотя бы одну тему!');return;}
  if(!state.level&&state.type!=='units'){alert('Выберите уровень сложности!');return;}
  const availableFormulas=state.selectedTopics.size===0?formulas:formulas.filter(f=>state.selectedTopics.has(f.topic));
  state.tasks=[];
  if(state.type==='tasks'||state.type==='mixed'){
    for(const formula of availableFormulas){
      const task=generateTask(formula,state.level);
      if(task)state.tasks.push({type:'task',...task});
    }
  }
  if(state.type==='units'||state.type==='mixed'){
    let selected=state.selectedTopics.size===0?[...unitsQuestions]:unitsQuestions.filter(q=>state.selectedTopics.has(q.topic));
    if(selected.length<3){
      const others=unitsQuestions.filter(q=>!state.selectedTopics.has(q.topic));
      while(selected.length<3&&others.length>0){
        const idx=Math.floor(Math.random()*others.length);
        selected.push(others.splice(idx,1)[0]);
      }
    }
    selected.sort(()=>Math.random()-0.5);
    for(const q of selected)state.tasks.push(generateUnitQuestion(q));
  }
  if(state.tasks.length===0){alert('Не удалось сгенерировать задания. Попробуйте другие темы или уровень.');return;}
  renderTest();
  showScreen('test-screen');
}

// ============================================================
// ОТРИСОВКА
// ============================================================
function renderTest(){
  const container=document.getElementById('tasks-container');
  container.innerHTML='';
  state.tasks.forEach((task,index)=>{
    const div=document.createElement('div');
    div.className='task';
    div.id=`task-${index}`;
    div.innerHTML=task.type==='task'?renderTaskQuestion(task,index):renderUnitQuestion(task,index);
    container.appendChild(div);
  });
}
function renderTaskQuestion(task,index){
  const formula=task.formula;
  const targetVar=task.targetVar;
  const targetVarDef=formula.variables[targetVar];
  let html=`
    <div class="task-header">
      <span class="task-number">Задание ${index+1}</span>
      <span class="task-topic">${formula.topic} · Уровень ${task.level}</span>
    </div>
    <div class="task-question">
      <strong>Найдите:</strong> ${targetVarDef.name}
      <div style="font-style:italic;color:#7f8c8d;font-size:14px;margin-top:5px">(${formula.name})</div>
    </div>
    <div class="task-given">
      <strong>Дано:</strong><br>`;
  for(const [key,varDef] of Object.entries(formula.variables)){
    if(key===targetVar)continue;
    html+=`${varDef.name} = ${task.values[key]} ${varDef.unit}<br>`;
  }
  html+=`
    </div>
    <div class="answer-input">
      <strong>Ответ:</strong>
      <input type="number" id="answer-${index}" step="any" placeholder="Число">
      <span class="answer-unit">${targetVarDef.unit}</span>
    </div>
    <div class="task-hint">Ответ округлите до сотых.</div>`;
  return html;
}
function renderUnitQuestion(task,index){
  const optionsHtml=(task.options||[]).map(o=>`<div class="unit-option" data-value="${o}" onclick="selectUnit(${index},this)">${o}</div>`).join('');
  return `
    <div class="task-header">
      <span class="task-number">Задание ${index+1}</span>
      <span class="task-topic">${task.topic}</span>
    </div>
    <div class="task-question">${task.question}</div>
    <div class="unit-options" id="options-${index}">${optionsHtml}</div>
    <div class="task-hint">Выберите один вариант ответа.</div>`;
}
function selectUnit(index,element){
  const container=document.getElementById(`options-${index}`);
  if(!container)return;
  container.querySelectorAll('.unit-option').forEach(el=>el.classList.remove('selected'));
  element.classList.add('selected');
  if(state.tasks&&state.tasks[index])state.tasks[index].userAnswer=element.dataset.value;
}

// ============================================================
// ПРОВЕРКА И РЕЗУЛЬТАТЫ
// ============================================================
function checkTest(){
  let correct=0;
  const total=state.tasks.length;
  state.tasks.forEach((task,index)=>{
    const taskDiv=document.getElementById(`task-${index}`);
    let isCorrect=false,userAnswer=null,correctAnswer=null;
    if(task.type==='task'){
      const input=document.getElementById(`answer-${index}`);
      const rawValue=input?input.value.trim():'';
      userAnswer=rawValue===''?null:parseFloat(rawValue.replace(',','.'));
      correctAnswer=Math.round(task.answer*100)/100;
      if(userAnswer!==null&&!isNaN(userAnswer)){
        userAnswer=Math.round(userAnswer*100)/100;
        isCorrect=Math.abs(userAnswer-correctAnswer)<0.01;
      }
    }else{
      userAnswer=task.userAnswer||'(не выбрано)';
      correctAnswer=task.correct;
      isCorrect=userAnswer===correctAnswer;
    }
    if(isCorrect){correct++;taskDiv.classList.add('correct');taskDiv.classList.remove('incorrect');}
    else{taskDiv.classList.add('incorrect');taskDiv.classList.remove('correct');}
    let resultHtml;
    if(isCorrect){resultHtml=`<div class="task-result correct">✅ Правильно!</div>`;}
    else{
      const displayUserAns=userAnswer===null?'(пусто)':userAnswer;
      resultHtml=`<div class="task-result incorrect">❌ Неправильно. Ваш ответ: <strong>${displayUserAns}</strong><br><span>Правильный ответ: <strong>${correctAnswer}</strong></span></div>`;
    }
    const oldResult=taskDiv.querySelector('.task-result');
    if(oldResult)oldResult.remove();
    taskDiv.insertAdjacentHTML('beforeend',resultHtml);
    if(task.type==='task'){
      const input=document.getElementById(`answer-${index}`);
      if(input)input.disabled=true;
    }else{
      const container=document.getElementById(`options-${index}`);
      if(container)container.querySelectorAll('.unit-option').forEach(el=>{el.style.pointerEvents='none';el.style.opacity='0.7';});
    }
  });
  showResults(correct,total);
}

function renderKatex(tex){
  try{
    const clean=tex.replace(/^\$\$/,'').replace(/\$\$$/,'');
    return katex.renderToString(clean,{displayMode:true,throwOnError:false});
  }catch(e){return `<code>${tex}</code>`;}
}

function showResults(correct,total){
  const percentage=total>0?Math.round(correct/total*100):0;
  document.getElementById('score-text').textContent=`${correct} из ${total} (${percentage}%)`;
  document.getElementById('score-fill').style.width=`${percentage}%`;
  document.getElementById('correct-count').textContent=correct;
  document.getElementById('incorrect-count').textContent=total-correct;
  document.getElementById('total-count').textContent=total;
  const detailedResults=document.getElementById('detailed-results');
  const topicStats={};
  state.tasks.forEach((task,index)=>{
    const topic=task.topic||(task.formula&&task.formula.topic?task.formula.topic:'Общее');
    if(!topicStats[topic])topicStats[topic]={correct:0,total:0};
    topicStats[topic].total++;
    const taskDiv=document.getElementById(`task-${index}`);
    if(taskDiv&&taskDiv.classList.contains('correct'))topicStats[topic].correct++;
  });
  let html='<h3>Результаты по темам:</h3>';
  for(const [topic,stats] of Object.entries(topicStats)){
    const percent=Math.round(stats.correct/stats.total*100);
    const barColor=percent>=80?'#4caf50':(percent>=50?'#ff9800':'#f44336');
    html+=`
      <div class="topic-stat-card">
        <div class="topic-stat-header"><span><strong>${topic}</strong></span><span>${stats.correct} из ${stats.total} (${percent}%)</span></div>
        <div class="topic-stat-bar-bg"><div class="topic-stat-bar-fill" style="width:${percent}%;background:${barColor};"></div></div>
      </div>`;
  }
  html+='<h3 style="margin-top:30px">Подробный разбор заданий:</h3>';
  state.tasks.forEach((task,index)=>{
    let isCorrect=false,userAnsDisplay='',correctAnsDisplay='',questionText='',formulaHtml='';
    if(task.type==='task'){
      const input=document.getElementById(`answer-${index}`);
      const rawValue=input?input.value.trim():'';
      const userVal=rawValue===''?null:parseFloat(rawValue.replace(',','.'));
      const expectedAnswer=task.answer!==undefined?Math.round(task.answer*100)/100:null;
      isCorrect=userVal!==null&&!isNaN(userVal)&&expectedAnswer!==null&&Math.abs(Math.round(userVal*100)/100-expectedAnswer)<0.01;
      userAnsDisplay=rawValue===''?'(пусто)':rawValue;
      correctAnsDisplay=expectedAnswer!==null?expectedAnswer:'—';
      const formula=task.formula;
      const variables=formula&&formula.variables?formula.variables:{};
      const mainVar=task.targetVar;
      const givenVars=Object.entries(task.values||{}).filter(([key])=>key!==mainVar).map(([key,val])=>{
        const varInfo=variables[key];
        const name=varInfo&&varInfo.name?varInfo.name:key;
        const unit=varInfo&&varInfo.unit?varInfo.unit:'';
        return `${name} = ${val} ${unit}`.trim();
      }).join(', ');
      const targetVar=variables[mainVar];
      const targetName=targetVar&&targetVar.name?targetVar.name:mainVar;
      const targetUnit=targetVar&&targetVar.unit?targetVar.unit:'';
      const formulaName=formula&&formula.name?formula.name:'Формула';
      questionText=`<strong>${formulaName}</strong><br>Дано: ${givenVars}.<br>Найти: ${targetName} (${targetUnit})`;
      // === ВЫВОД ПРАВИЛЬНОЙ ФОРМУЛЫ ===
      if(formula&&formula.formula){
        formulaHtml=`<div class="review-formula"><div class="review-formula-label">📐 Правильная формула:</div>${renderKatex(formula.formula)}</div>`;
      }
    }else{
      isCorrect=task.userAnswer===task.correct;
      userAnsDisplay=task.userAnswer||'(не выбрано)';
      correctAnsDisplay=task.correct||'—';
      questionText=task.question||'Вопрос о единицах измерения';
    }
    const statusClass=isCorrect?'correct':'incorrect';
    const icon=isCorrect?'✅':'❌';
    const topic=task.topic||(task.formula&&task.formula.topic?task.formula.topic:'Общее');
    html+=`
      <div class="review-card ${statusClass}">
        <div class="review-header"><span style="font-size:18px">${icon}</span><span class="review-title">Задание ${index+1} • ${topic}</span></div>
        <div class="review-question">${questionText}</div>
        ${formulaHtml}
        <div>
          <div class="ans-row"><span class="ans-label">Ваш ответ:</span><span class="ans-value ${statusClass}">${userAnsDisplay}</span></div>
          ${!isCorrect?`<div class="ans-row"><span class="ans-label">Правильный ответ:</span><span class="ans-value correct">${correctAnsDisplay}</span></div>`:''}
        </div>
      </div>`;
  });
  detailedResults.innerHTML=html;
  showScreen('results-screen');
}

function restartTest(){
  generateTest();
}

initTopics();
